user: pi
group: pi
# Fixed by DHCP reservations on the home router: ufw rules depend on them
admin_ip: 192.168.1.27
# raspberry02_ip and pi_core_ip are used by ufw_rules below;
# raspberry01_ip is not used by a rule yet, it is recorded for rules that will be set in the future
raspberry01_ip: 192.168.1.18
raspberry02_ip: 192.168.1.2
pi_core_ip: 192.168.1.10
# Windfire CA certificates (public certificates only, never the CA private keys), installed by the windfire_ca play of
# raspberry-configure-windfire-infra.yaml (./configure-windfire-infra.sh --tags windfire_ca) in windfire_ca_dir on
# every Raspberry PI box: the single copy every service reads.
# The folder is root:root 0755 and the certificates root:root 0644: every service user can read them, only root can
# change them. They are not added to the system trust store: each service points at the file it needs.
windfire_ca_dir: /etc/windfire/ca
local_home_dir: "{{ lookup('env', 'HOME') }}"
windfire_ca_certificates:
  - { name: WindfireRootCA.crt,         local_path: "{{ local_home_dir }}/opt/windfire/ssl/truststore/WindfireRootCA.crt" }
  - { name: WindfireKeycloakRootCA.crt, local_path: "{{ local_home_dir }}/opt/keycloak/ssl/truststore/WindfireKeycloakRootCA.crt" }
# Copies the service deploys used to put in the pi user's home folder, removed once no service references them:
# ./configure-windfire-infra.sh --tags windfire_ca -e windfire_ca_remove_legacy=true
windfire_ca_legacy_copies:
  - /home/pi/opt/windfire/ssl/truststore/WindfireRootCA.crt
  - /home/pi/opt/keycloak/ssl/truststore/WindfireKeycloakRootCA.crt
windfire_ca_remove_legacy: false
# Alloy ships to Grafana Cloud only the journal of these systemd units
# (plus kernel "[UFW BLOCK]" lines); everything else stays on the Pi
alloy_journal_units:
  - keycloak.service
  - windfire-security.service
  - windfire-calendar.service
  - windfire-restaurants-backend.service
  - windfire-ui-react.service
  - ssh.service
  - unattended-upgrades.service
# UFW allow rules per host, ensured by raspberry-configure-windfire-infra.yaml (never reset).
# Each rule: port, proto (tcp | udp | any), from (an IP or 'any'), comment.
# The SSH rule from admin_ip is set by raspberry.yaml too: keep it identical here.
ufw_rules:
  raspberry01:
    - { port: '22',   proto: tcp, from: "{{ admin_ip }}",       comment: SSH from admin laptop }
    - { port: '8443', proto: tcp, from: "{{ pi_core_ip }}",     comment: Caddy -> Keycloak }
    - { port: '7500', proto: tcp, from: "{{ pi_core_ip }}",     comment: Tang for pi-core }
    - { port: '9443', proto: tcp, from: "{{ pi_core_ip }}",     comment: step-ca }
    - { port: '9443', proto: tcp, from: "{{ admin_ip }}",       comment: step-ca admin }
    - { port: '8443', proto: tcp, from: "{{ admin_ip }}",       comment: Keycloak admin }
    - { port: '8444', proto: tcp, from: "{{ admin_ip }}",       comment: Windfire Security }
    - { port: '8443', proto: tcp, from: "{{ raspberry02_ip }}", comment: Keycloak admin from raspberry02 }
    - { port: '8444', proto: tcp, from: "{{ raspberry02_ip }}", comment: Windfire Security from raspberry02 }
    - { port: '9000', proto: tcp, from: "{{ admin_ip }}",       comment: health check from admin laptop }
    - { port: '8445', proto: tcp, from: "{{ admin_ip }}",       comment: windfire-ui-react }
  raspberry02:
    - { port: '22',   proto: tcp, from: "{{ admin_ip }}",       comment: SSH from admin laptop }
    - { port: '8081', proto: tcp, from: "{{ admin_ip }}",       comment: Windfire Restaurants Backend }
    - { port: '8443', proto: tcp, from: "{{ admin_ip }}",       comment: Windfire Calendar }
    # windfire-maps: no rule left on the Pi, so none is listed here
# true: delete the UFW rules that are not in ufw_rules (the SSH rule from admin_ip is always kept).
# Override per run with -e ufw_prune_unlisted=true
ufw_prune_unlisted: false
