--- # Ansible Playbook to configure the Windfire infrastructure on the Raspberry PIs in a consistent and repeatable way
# (UFW rules per host, the shared Windfire CA certificates and per-service software); run raspberry.yaml (install.sh) first
# Each play has a tag, so one part can run alone (configure-windfire-infra.sh passes extra arguments to ansible-playbook):
#   ./configure-windfire-infra.sh --tags ufw           UFW rules only
#   ./configure-windfire-infra.sh --tags windfire_ca   Windfire CA certificates only (install or rotate)
#   ./configure-windfire-infra.sh --tags java          OpenJDK on appserver boxes only (apt update and dist-upgrade first)
# ===== UFW rules for all Raspberry PI boxes, from ufw_rules in conf/config.yml
# Only ensures rules on a Pi where ufw is already active: never enables, resets or changes defaults (raspberry.yaml does that)
- hosts: raspberry
  remote_user: "{{ user }}"
  become: yes
  tags: [ufw]
  vars:
    src_dir: "{{ playbook_dir }}"
    ufw_rules_host: "{{ ufw_rules[inventory_hostname] | default([]) }}"
    # Always kept by the prune: the rule raspberry.yaml sets so Ansible (and you) can get in
    ufw_ssh_admin_key: "22/tcp|ALLOW IN|{{ admin_ip }}"
  vars_files:
    - "{{ src_dir }}/conf/config.yml"
  tasks:
    #######################
    ##### UFW Section #####
    #######################
    # Reads run in --check too (command tasks are otherwise skipped in check mode)
    - name: Get UFW status
      command: ufw status
      register: ufw_initial_status
      changed_when: false
      check_mode: false
    - name: Assert UFW is already active (enabled by raspberry.yaml)
      assert:
        that:
          - "'Status: active' in ufw_initial_status.stdout"
        fail_msg: "UFW is not active on {{ inventory_hostname }}: run install.sh (raspberry.yaml) first"
    - name: Get the IP this play connects from
      shell: echo "$SSH_CLIENT"
      become: no
      register: ssh_client
      changed_when: false
      check_mode: false
    # Changing rules from any other IP could cut Ansible (and you) off the box
    - name: Assert the play runs from the admin laptop before changing UFW rules
      assert:
        that:
          - ssh_client.stdout.split() | length > 0
          - ssh_client.stdout.split()[0] == admin_ip
        fail_msg: "Connected from '{{ ssh_client.stdout }}', not admin_ip {{ admin_ip }}: UFW rules not changed"
    - name: Ensure the UFW rules listed in ufw_rules
      community.general.ufw:
        rule: allow
        port: "{{ item.port }}"
        proto: "{{ item.proto | default('any') }}"
        from_ip: "{{ item.from | default('any') }}"
        comment: "{{ item.comment }}"
      loop: "{{ ufw_rules_host }}"
      loop_control:
        label: "{{ item.port }}/{{ item.proto | default('any') }} from {{ item.from | default('any') }} ({{ item.comment }})"
    ###################################
    ##### UFW prune (optional)    #####
    ###################################
    - name: Prune UFW rules not listed in ufw_rules
      when: ufw_prune_unlisted | bool
      block:
        - name: Assert ufw_rules has rules for this host before pruning
          assert:
            that:
              - ufw_rules_host | length > 0
            fail_msg: "ufw_rules has no rules for {{ inventory_hostname }}: prune refused, it would delete every rule but SSH"
        - name: Get numbered UFW rules
          command: ufw status numbered
          register: ufw_numbered
          changed_when: false
          check_mode: false
        # Rule key: "<to>|<action>|<from>", (v6) dropped so a v6 twin matches its listed rule
        - name: Find UFW rules not listed in ufw_rules
          set_fact:
            ufw_unlisted_json: >-
              {%- set wanted = [ufw_ssh_admin_key] -%}
              {%- for r in ufw_rules_host -%}
              {%- set proto = r.proto | default('any') -%}
              {%- set src = r.from | default('any') -%}
              {%- set _ = wanted.append(r.port ~ ('' if proto == 'any' else '/' ~ proto) ~ '|ALLOW IN|' ~ ('Anywhere' if src == 'any' else src)) -%}
              {%- endfor -%}
              {%- set unlisted = [] -%}
              {%- for line in ufw_numbered.stdout_lines -%}
              {%- set m = line | regex_search('^\\[\\s*(\\d+)\\]\\s+(.+?)\\s{2,}(ALLOW|DENY|REJECT|LIMIT)( IN| OUT|)\\s+(.+?)\\s*(#.*)?$', '\\1', '\\2', '\\3', '\\4', '\\5') -%}
              {%- if m -%}
              {%- set key = (m[1] | replace(' (v6)', '')) ~ '|' ~ m[2] ~ m[3] ~ '|' ~ (m[4] | replace(' (v6)', '')) -%}
              {%- if key not in wanted -%}
              {%- set _ = unlisted.append({'num': m[0] | int, 'rule': line | regex_replace('^\\[\\s*\\d+\\]\\s+', '')}) -%}
              {%- endif -%}
              {%- endif -%}
              {%- endfor -%}
              {{ unlisted | to_json }}
        - name: Show UFW rules that will be deleted
          debug:
            msg: "{{ ufw_unlisted_json | from_json | map(attribute='rule') | list }}"
        # Highest number first, so the numbers of the rules still to delete do not shift
        - name: Delete UFW rules not listed in ufw_rules
          command: ufw --force delete {{ item.num }}
          loop: "{{ ufw_unlisted_json | from_json | sort(attribute='num', reverse=true) }}"
          loop_control:
            label: "[{{ item.num }}] {{ item.rule }}"
  post_tasks:
    - name: Get UFW status after the changes
      command: ufw status verbose
      register: ufw_status
      changed_when: false
      check_mode: false
    - name: Assert UFW is still active and allows SSH from admin laptop
      assert:
        that:
          - "'Status: active' in ufw_status.stdout"
          - ufw_status.stdout_lines | select('match', '^22/tcp\\s+ALLOW IN\\s+' ~ (admin_ip | regex_escape) ~ '\\s+# SSH from admin laptop') | list | length > 0
        fail_msg: "Unexpected UFW status: {{ ufw_status.stdout_lines }}"
# ===== Windfire CA certificates in /etc/windfire/ca on all Raspberry PI boxes (tag windfire_ca)
# The public CA certificates come from the admin laptop (the CA private keys never leave it and never reach a Pi) and
# land in windfire_ca_dir (/etc/windfire/ca): folder root:root 0755, certificates root:root 0644. Every service reads
# its CA from there and the service deploys only check it; only root can change it. Nothing is added to the system
# trust store. The laptop checks run once, delegated to localhost, so they also run with --limit.
- hosts: raspberry
  remote_user: "{{ user }}"
  become: yes
  tags: [windfire_ca]
  vars:
    src_dir: "{{ playbook_dir }}"
  vars_files:
    - "{{ src_dir }}/conf/config.yml"
  tasks:
    #################################################################
    ##### Windfire CA pre-flight Section (on the admin laptop) #####
    #################################################################
    # Each CA file must exist, be a CA certificate with a critical nameConstraints extension, and hold no private key
    # Run once on the laptop: the result (the expected fingerprints) is set for every Pi of the play,
    # and a failure stops the play on every Pi before anything is copied
    - name: Check the CA certificates on the admin laptop
      delegate_to: localhost
      become: false
      run_once: true
      any_errors_fatal: true
      block:
        - name: Check the CA certificates exist on the admin laptop
          stat:
            path: "{{ item.local_path }}"
          loop: "{{ windfire_ca_certificates }}"
          loop_control:
            label: "{{ item.local_path }}"
          register: local_ca_stat
        - name: Fail if a CA certificate is missing on the admin laptop
          fail:
            msg: >-
              {{ item.item.local_path }} not found: create it with windfire-security/ssl/createRootCA.sh
              (Windfire Root CA) or windfire-security/keycloak/security/setupTLS.sh (Windfire Keycloak Root CA)
          when: not item.stat.exists
          loop: "{{ local_ca_stat.results }}"
          loop_control:
            label: "{{ item.item.name }}"
        # A CA file must be a public certificate only: a private key must never be copied to a Pi
        - name: Check no CA file holds a private key
          command: grep -q "PRIVATE KEY" "{{ item.local_path }}"
          register: local_ca_key
          failed_when: local_ca_key.rc == 0
          changed_when: false
          check_mode: false
          loop: "{{ windfire_ca_certificates }}"
          loop_control:
            label: "{{ item.name }}"
        # -text (not -ext) so the macOS LibreSSL openssl works too
        - name: Read the CA certificates
          command: openssl x509 -noout -text -in "{{ item.local_path }}"
          register: local_ca_text
          changed_when: false
          check_mode: false
          loop: "{{ windfire_ca_certificates }}"
          loop_control:
            label: "{{ item.name }}"
        - name: Check each CA certificate is a CA with a critical nameConstraints extension
          assert:
            that:
              - "'CA:TRUE' in item.stdout"
              - "'X509v3 Name Constraints: critical' in item.stdout"
            fail_msg: >-
              {{ item.item.name }} is not a name constrained CA certificate: recreate it with the
              windfire-security scripts (see Root CA name constraints in its README)
            quiet: true
          loop: "{{ local_ca_text.results }}"
          loop_control:
            label: "{{ item.item.name }}"
        - name: Read the SHA-256 fingerprints of the CA certificates
          command: openssl x509 -noout -fingerprint -sha256 -in "{{ item.local_path }}"
          register: local_ca_fingerprint
          changed_when: false
          check_mode: false
          loop: "{{ windfire_ca_certificates }}"
          loop_control:
            label: "{{ item.name }}"
        - name: Record the expected fingerprints
          set_fact:
            windfire_ca_expected_fingerprints: >-
              {{ dict(local_ca_fingerprint.results | map(attribute='item.name')
                      | zip(local_ca_fingerprint.results | map(attribute='stdout')
                            | map('regex_replace', '^.*=', '') | map('upper'))) }}
    ######################################
    ##### Windfire CA folder Section #####
    ######################################
    - name: Create the Windfire CA folder {{ windfire_ca_dir }} and its parent (root:root 0755)
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ windfire_ca_dir | dirname }}"
        - "{{ windfire_ca_dir }}"
    - name: Copy the CA certificates to {{ windfire_ca_dir }} (root:root 0644)
      copy:
        src: "{{ item.local_path }}"
        dest: "{{ windfire_ca_dir }}/{{ item.name }}"
        owner: root
        group: root
        mode: "0644"
        validate: openssl x509 -noout -in %s
      loop: "{{ windfire_ca_certificates }}"
      loop_control:
        label: "{{ item.name }}"
    # Skipped in check mode: on a first run the files do not exist yet
    - name: Read the SHA-256 fingerprints of the installed CA certificates
      command: openssl x509 -noout -fingerprint -sha256 -in "{{ windfire_ca_dir }}/{{ item.name }}"
      register: remote_ca_fingerprint
      changed_when: false
      when: not ansible_check_mode
      loop: "{{ windfire_ca_certificates }}"
      loop_control:
        label: "{{ item.name }}"
    - name: Check the installed CA certificates match the admin laptop's
      assert:
        that:
          - (item.stdout | regex_replace('^.*=', '') | upper) == windfire_ca_expected_fingerprints[item.item.name]
        fail_msg: "{{ windfire_ca_dir }}/{{ item.item.name }} on {{ inventory_hostname }} does not match the admin laptop's copy"
        success_msg: "{{ item.item.name }} SHA-256 {{ item.stdout | regex_replace('^.*=', '') | upper }}"
      when: not ansible_check_mode
      loop: "{{ remote_ca_fingerprint.results }}"
      loop_control:
        label: "{{ item.item.name }}"
    #################################################################
    ##### Legacy copies Section (windfire_ca_remove_legacy=true) #####
    #################################################################
    # Before the shared folder, every service deploy copied the CAs into its own folder and into the pi user's
    # home folder. The pi home copies are deleted only when no systemd unit or deployed .env file references a
    # CA certificate outside {{ windfire_ca_dir }} any more (i.e. every service has been redeployed).
    - name: Remove the legacy CA copies from the pi home folder
      when: windfire_ca_remove_legacy | bool
      block:
        - name: Find CA certificate paths outside {{ windfire_ca_dir }} in systemd units and deployed .env files
          shell: |
            { find /etc/systemd/system -type f \( -name '*.service' -o -name '*.conf' \);
              find /home/pi -maxdepth 4 -type f \( -name '.env' -o -name '*.env' \) -not -path '*/node_modules/*'; } \
              | xargs -r grep -HoE '[^[:space:]=:"]*RootCA\.crt' \
              | grep -vF ':{{ windfire_ca_dir }}/' || true
          args:
            executable: /bin/bash
          register: legacy_ca_references
          changed_when: false
          check_mode: false
        - name: Fail if a service still reads a CA certificate outside {{ windfire_ca_dir }}
          fail:
            msg: >-
              On {{ inventory_hostname }} these files still point at a CA certificate outside {{ windfire_ca_dir }},
              redeploy their service first: {{ legacy_ca_references.stdout_lines | join(', ') }}
          when: legacy_ca_references.stdout_lines | length > 0
        - name: Delete the legacy CA copies
          file:
            path: "{{ item }}"
            state: absent
          loop: "{{ windfire_ca_legacy_copies }}"
# ===== OpenJDK installation and configuration for "appserver" Raspberry PI boxes
- hosts: appserver
  remote_user: "{{ user }}"
  become: yes
  tags: [java]
  vars:
    src_dir: "{{ playbook_dir }}"
    mode: u=rwx
  vars_files:
    - "{{ src_dir }}/conf/config.yml"
  tasks:
    ###############################################
    ##### Update package manager repositories #####
    ###############################################
    - name: Update package manager repositories cache
      apt:
        update_cache: yes
    ######################################
    ##### Upgrade installed packages #####
    ######################################
    - name: Upgrade installed packages
      apt:
        upgrade: dist
    ########################
    ##### Java Section #####
    ########################
    - name: Install OpenJDK
      apt:
        name: default-jdk
        state: present
