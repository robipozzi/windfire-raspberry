version: 2
updates:
  # GitHub Actions is the only ecosystem in this repo: there are no
  # requirements.txt, package.json or pom.xml files to monitor.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-and-patch:
        update-types:
          - minor
          - patch
