--- # Ansible Playbook to configure a set of Raspberry PIs in a consistent and repeatable way
# ===== OpenJDK installation and configuration for "appserver" Raspberry PI boxes
- hosts: appserver
  remote_user: "{{ user }}"
  become: yes
  vars:
    src_dir: "{{ playbook_dir }}"
    mode: u=rwx
  vars_files:
    - "{{ src_dir }}/conf/config.yml"
  tasks:
    ###############################################
    ##### Update package manager repositories #####
    ###############################################
    - name: Update package manager repositories cache
      apt:
        update_cache: yes
    ######################################
    ##### Upgrade installed packages #####
    ######################################
    - name: Upgrade installed packages
      apt:
        upgrade: dist
    ########################
    ##### Java Section #####
    ########################
    - name: Install OpenJDK
      apt:
        name: default-jdk
        state: present
# ===== NodeJs installation and configuration for "maps_service" Raspberry PI boxes
- hosts: maps_service
  remote_user: "{{ user }}"
  become: yes
  vars:
    src_dir: "{{ playbook_dir }}"
    mode: u=rwx
    nodejs_version: "26.x"  # You can change this to the desired NodeJS version
  vars_files:
    - "{{ src_dir }}/conf/config.yml"
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
      changed_when: false
    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - curl
          - gnupg
        state: present
    - name: Ensure /etc/apt/keyrings directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
    - name: Download NodeSource repository signing key
      get_url:
        url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        dest: /etc/apt/keyrings/nodesource.asc
        mode: "0644"
    - name: Add NodeJS repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ nodejs_version }} nodistro main"
        filename: nodesource
        update_cache: yes
    - name: Install NodeJS
      apt:
        name: 
          - nodejs
        state: present
    - name: Verify NodeJS installation
      command: node --version
      register: node_version
      changed_when: false
    - name: Display NodeJS version
      debug:
        msg: "Installed NodeJS version: {{ node_version.stdout }}"
    - name: Verify npm installation
      command: npm --version
      register: npm_version
      changed_when: false
    - name: Display npm version
      debug:
        msg: "Installed npm version: {{ npm_version.stdout }}"
    - name: Install pm2 process manager for Node.js
      npm:
        name: pm2
        global: yes
        production: yes
        state: present