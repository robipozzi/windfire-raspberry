--- # Ansible Playbook to configure a set of Raspberry PIs in a consistent and repeatable way
# ===== Software installation and configuration for all Raspberry PI boxes
- hosts: raspberry
  remote_user: "{{ user }}"
  become: yes
  vars:
    src_dir: "{{ playbook_dir }}"
    mode: u=rwx
  vars_files:
    - "{{ src_dir }}/conf/config.yml"
  pre_tasks:
    ###############################################
    ##### Update package manager repositories #####
    ###############################################
    - name: Update package manager repositories cache
      apt:
        update_cache: yes
    ######################################
    ##### Upgrade installed packages #####
    ######################################
    - name: Upgrade installed packages
      apt:
        upgrade: dist
    ###########################
    ##### Openssl Section #####
    ###########################
    - name: Install Openssl 
      apt: 
        name: openssl 
        state: present
    ####################################################
    ##### Grafana Cloud Alloy installation Section #####
    ####################################################
    - name: Install and configure Grafana Cloud Alloy
      ansible.builtin.include_role:
        name: grafana.grafana.alloy
      vars:
        alloy_env_file_vars:
          GCLOUD_RW_API_KEY: "{{ gcloud_rw_api_key }}"
        alloy_config: |
          remotecfg {
                  url            = "https://fleet-management-prod-011.grafana.net"
                  id             = "{{ inventory_hostname }}"
                  poll_frequency = "60s"
                  attributes     = encoding.from_json(coalesce(``, `{}`))

                  basic_auth {
                          username = "1571786"
                          password = sys.env("GCLOUD_RW_API_KEY")
                  }
          }

          prometheus.remote_write "metrics_service" {
                  endpoint {
                          url = "https://prometheus-prod-65-prod-eu-west-2.grafana.net/api/prom/push"

                          basic_auth {
                                  username = "3067800"
                                  password = sys.env("GCLOUD_RW_API_KEY")
                          }
                  }
          }

          loki.write "grafana_cloud_loki" {
                  endpoint {
                          url = "https://logs-prod-012.grafana.net/loki/api/v1/push"

                          basic_auth {
                                  username = "1529575"
                                  password = sys.env("GCLOUD_RW_API_KEY")
                          }
                  }
          }
          prometheus.exporter.unix "integrations_node_exporter" { }

          discovery.relabel "integrations_node_exporter" {
                  targets = prometheus.exporter.unix.integrations_node_exporter.targets

                  rule {
                          target_label = "instance"
                          replacement  = constants.hostname
                  }

                  rule {
                          target_label = "job"
                          replacement  = "integrations/raspberrypi-node"
                  }
          }

          prometheus.scrape "integrations_node_exporter" {
                  targets    = discovery.relabel.integrations_node_exporter.output
                  forward_to = [prometheus.relabel.integrations_node_exporter.receiver]
                  job_name   = "integrations/node_exporter"
          }

          prometheus.relabel "integrations_node_exporter" {
                  forward_to = [prometheus.remote_write.metrics_service.receiver]

                  rule {
                          source_labels = ["__name__"]
                          regex         = "up|node_boot_time_seconds|node_cpu_seconds_total|node_disk_io_time_seconds_total|node_disk_io_time_weighted_seconds_total|node_disk_read_bytes_total|node_disk_written_bytes_total|node_filesystem_avail_bytes|node_filesystem_files|node_filesystem_files_free|node_filesystem_readonly|node_filesystem_size_bytes|node_hwmon_temp_celsius|node_load1|node_load15|node_load5|node_memory_Buffers_bytes|node_memory_Cached_bytes|node_memory_MemAvailable_bytes|node_memory_MemFree_bytes|node_memory_MemTotal_bytes|node_memory_Slab_bytes|node_memory_SwapTotal_bytes|node_network_receive_bytes_total|node_network_receive_drop_total|node_network_receive_errs_total|node_network_receive_packets_total|node_network_transmit_bytes_total|node_network_transmit_drop_total|node_network_transmit_errs_total|node_network_transmit_packets_total|node_os_info|node_systemd_unit_state|node_uname_info|node_vmstat_pgmajfault"
                          action        = "keep"
                  }
          }

          discovery.relabel "logs_integrations_integrations_node_exporter_journal_scrape" {
                  targets = []

                  rule {
                          source_labels = ["__journal__systemd_unit"]
                          target_label  = "unit"
                  }

                  rule {
                          source_labels = ["__journal__boot_id"]
                          target_label  = "boot_id"
                  }

                  rule {
                          source_labels = ["__journal__transport"]
                          target_label  = "transport"
                  }

                  rule {
                          source_labels = ["__journal_priority_keyword"]
                          target_label  = "level"
                  }
          }

          loki.source.journal "logs_integrations_integrations_node_exporter_journal_scrape" {
                  max_age       = "24h0m0s"
                  relabel_rules = discovery.relabel.logs_integrations_integrations_node_exporter_journal_scrape.rules
                  forward_to    = [loki.write.grafana_cloud_loki.receiver]
                  labels        = {
                          instance = constants.hostname,
                          job      = "integrations/raspberrypi-node",
                  }
          }

          local.file_match "logs_integrations_integrations_node_exporter_direct_scrape" {
                  path_targets = [{
                          __address__ = "localhost",
                          __path__    = "/var/log/{syslog,messages,*.log}",
                          instance    = constants.hostname,
                          job         = "integrations/raspberrypi-node",
                  }]
          }
          loki.source.file "logs_integrations_integrations_node_exporter_direct_scrape" {
                  targets    = local.file_match.logs_integrations_integrations_node_exporter_direct_scrape.targets
                  forward_to = [loki.write.grafana_cloud_loki.receiver]
          }
  tasks:
    #######################
    ##### UFW Section #####
    #######################
    # Package only: rules on existing boxes are hand-made and must stay untouched
    - name: Install UFW
      apt:
        name: ufw
        state: present
    ##########################
    ##### Chrony Section #####
    ##########################
    - name: Install Chrony (replaces systemd-timesyncd)
      apt:
        name: chrony
        state: present
    - name: Start and enable Chrony
      service:
        name: chrony
        state: started
        enabled: yes
    ############################
    ##### Step CLI Section #####
    ############################
    - name: Create apt keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
    - name: Get Smallstep apt repository signing key
      get_url:
        url: https://packages.smallstep.com/keys/apt/repo-signing-key.gpg
        dest: /etc/apt/keyrings/smallstep.asc
        mode: '0644'
    - name: Add Smallstep apt repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/smallstep.asc] https://packages.smallstep.com/stable/debian debs main"
        filename: smallstep
        state: present
    - name: Install Step CLI
      apt:
        name: step-cli
        state: present
    ##############################################
    ##### Automatic security updates Section #####
    ##############################################
    - name: Install unattended-upgrades, apt-listchanges and needrestart
      apt:
        name:
          - unattended-upgrades
          - apt-listchanges
          - needrestart
        state: present
    # Non-interactive equivalent of 'dpkg-reconfigure -plow unattended-upgrades'
    - name: Enable periodic package list update and unattended upgrades
      copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: '0644'
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
    # ${distro_codename} is expanded by unattended-upgrades, not by Jinja
    - name: Allow Raspberry Pi Foundation origin in unattended upgrades
      lineinfile:
        path: /etc/apt/apt.conf.d/50unattended-upgrades
        insertafter: '^Unattended-Upgrade::Origins-Pattern \{'
        line: '        "origin=Raspberry Pi Foundation,codename=${distro_codename},label=Raspberry Pi Foundation";'
    - name: Let needrestart restart services automatically (never prompt)
      copy:
        dest: /etc/needrestart/conf.d/50-autorestart.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          $nrconf{restart} = 'a';
    ###################################
    ##### Harden pi admin Section #####
    ###################################
    # Safety gates: stop before SSH passwords are disabled on a box without a key
    - name: Check pi authorized_keys
      stat:
        path: /home/{{ user }}/.ssh/authorized_keys
      register: pi_authorized_keys
    - name: Assert pi has a non-empty authorized_keys
      assert:
        that:
          - pi_authorized_keys.stat.exists
          - pi_authorized_keys.stat.size > 0
        fail_msg: "/home/{{ user }}/.ssh/authorized_keys is missing or empty: SSH hardening would lock you out"
    - name: Get pi password status
      command: passwd -S {{ user }}
      register: pi_passwd_status
      changed_when: false
    - name: Assert pi has a usable password (needed by sudo)
      assert:
        that:
          - pi_passwd_status.stdout.split()[1] == 'P'
        fail_msg: "{{ user }} has no usable password (status {{ pi_passwd_status.stdout.split()[1] }}): sudo would be unusable"
    - name: Remove pi passwordless sudo rule
      file:
        path: /etc/sudoers.d/010_pi-nopasswd
        state: absent
    - name: Look for passwordless sudo rules that apply to pi
      shell: grep -rhE '^[[:space:]]*({{ user }}|%sudo|ALL)[[:space:]].*NOPASSWD' /etc/sudoers /etc/sudoers.d
      register: pi_nopasswd
      changed_when: false
      failed_when: pi_nopasswd.rc > 1
    - name: Assert sudo always asks pi for a password
      assert:
        that:
          - pi_nopasswd.stdout_lines | length == 0
        fail_msg: "NOPASSWD sudo rules still apply to {{ user }}: {{ pi_nopasswd.stdout_lines }}"
    #################################
    ##### SSH hardening Section #####
    #################################
    # sshd keeps the first value it reads: 10- wins over Raspberry Pi OS 50-cloud-init.conf
    - name: Harden SSH daemon configuration
      copy:
        dest: /etc/ssh/sshd_config.d/10-hardening.conf
        owner: root
        group: root
        mode: '0644'
        validate: /usr/sbin/sshd -t -f %s
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
          PubkeyAuthentication yes
          AllowUsers {{ user }}
      notify: reload ssh
  handlers:
    # A reload keeps the Ansible SSH session that is already open
    - name: reload ssh
      command: /usr/sbin/sshd -t
      notify: do reload ssh
    - name: do reload ssh
      service:
        name: ssh
        state: reloaded
  post_tasks:
    - name: Apply pending configuration changes before checks
      meta: flush_handlers
    ###########################
    ##### Baseline checks #####
    ###########################
    - name: Check Chrony time synchronization
      command: chronyc tracking
      register: chrony_tracking
      changed_when: false
      until: "'Leap status     : Normal' in chrony_tracking.stdout"
      retries: 12
      delay: 5
    - name: Show System time offset
      debug:
        msg: "{{ chrony_tracking.stdout_lines | select('match', '^System time') | first }}"
    - name: Check unattended upgrades allowed origins
      shell: unattended-upgrade --dry-run --debug 2>&1 | grep -i 'allowed origins'
      register: uu_origins
      changed_when: false
    - name: Assert security and Raspberry Pi Foundation origins are allowed
      assert:
        that:
          - "'Debian-Security' in uu_origins.stdout"
          - "'Raspberry Pi Foundation' in uu_origins.stdout"
        fail_msg: "Unexpected unattended-upgrades origins: {{ uu_origins.stdout }}"
    - name: Get effective SSH daemon configuration
      command: /usr/sbin/sshd -T
      register: sshd_effective
      changed_when: false
    - name: Assert SSH daemon is hardened
      assert:
        that:
          - "'passwordauthentication no' in sshd_effective.stdout_lines"
          - "'kbdinteractiveauthentication no' in sshd_effective.stdout_lines"
          - "'permitrootlogin no' in sshd_effective.stdout_lines"
          - "'pubkeyauthentication yes' in sshd_effective.stdout_lines"
          - "('allowusers ' ~ user) in sshd_effective.stdout_lines"
    # Key login is already proven: this play connected with it
    - name: Check password login is refused
      command: >
        ssh -o PubkeyAuthentication=no -o BatchMode=yes -o StrictHostKeyChecking=accept-new
        {{ user }}@{{ inventory_hostname }} true
      delegate_to: localhost
      become: no
      register: ssh_password_login
      changed_when: false
      failed_when: >
        ssh_password_login.rc == 0 or
        'Permission denied (publickey)' not in ssh_password_login.stderr
